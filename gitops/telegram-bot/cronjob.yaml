apiVersion: batch/v1
kind: CronJob
metadata:
  name: telegram-bot-monitor
  namespace: default
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: telegram-bot-sa
          restartPolicy: Never
          containers:
            - name: telegram-bot
              image: <TON_ID_COMPTE>.dkr.ecr.eu-north-1.amazonaws.com/microservices-demo/telegrambot:<TAG>
              env:
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: telegram-bot-secrets
                      key: TELEGRAM_BOT_TOKEN
                - name: TELEGRAM_CHAT_ID
                  valueFrom:
                    secretKeyRef:
                      name: telegram-bot-secrets
                      key: TELEGRAM_CHAT_ID
                - name: GROQ_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: telegram-bot-secrets
                      key: GROQ_API_KEY
                - name: WATCH_NAMESPACE
                  value: "default"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
