name: Build, Scan and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'telegram-bot/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  gitleaks:
    name: Scan des secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan-push:
    name: Build, Trivy, Push
    needs: gitleaks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: src/frontend
          - service: cartservice
            context: src/cartservice/src
          - service: checkoutservice
            context: src/checkoutservice
          - service: currencyservice
            context: src/currencyservice
          - service: paymentservice
            context: src/paymentservice
          - service: productcatalogservice
            context: src/productcatalogservice
          - service: shippingservice
            context: src/shippingservice
          - service: telegrambot
            context: src/telegram-bot
    steps:
      - uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC, sans clé stockée)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion à ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build de l'image
        run: |
          docker build -t ${{ matrix.service }}:${{ github.sha }} ${{ matrix.context }}

      - name: Scan Trivy (vulnérabilités)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Tag et push vers ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/microservices-demo/${{ matrix.service }}:${{ github.sha }}"
          docker tag ${{ matrix.service }}:${{ github.sha }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Image poussée : $IMAGE_URI"

  update-gitops:
    name: Mise à jour du repo GitOps (déclenche ArgoCD)
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour gitops/values.yaml avec le nouveau tag
        run: |
          sed -i "s|repository: .*|repository: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/microservices-demo|" gitops/values.yaml
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" gitops/values.yaml
          cat gitops/values.yaml | grep -A 2 "^images:"
      - name: Mettre à jour le tag du bot Telegram
        run: |
          sed -i "s|image: .*telegrambot:.*|image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/microservices-demo/telegrambot:${{ github.sha }}|" gitops/telegram-bot/cronjob.yaml
      - name: Commit et push le changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/values.yaml
          git diff --staged --quiet && echo "Aucun changement" && exit 0
          git commit -m "GitOps: mise à jour des images vers ${{ github.sha }}"
          git push